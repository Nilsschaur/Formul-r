<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./style.css"/>

    <script src="index.js" defer></script>
</head>
<body>

    <h3 class="rubrik">Kontaktformulär</h3>
    
    <form id="contactForm" class="test">
        <label for="name" class="grej">Namn</label>

        <input type="text" id="name" required class="viggo">

        <label for="email" class="grej">E-post</label>
        <input type="email" id="email" required class="viggo">

        <label for="message" class="grej">Meddelande</label>
        <textarea id="message" required maxlength="500" class="viggo"></textarea>

        <label for="subject" class="grej">Ämne</label>
        <select id="subject" required class="viggo">
            <option value="">--Välj ämne--</option>
            <option value="fraga">Fråga</option>
            <option value="feedback">Feedback</option>
            <option value="annat">Annat</option>
         </select>
        <label class="grej">
        <input type="checkbox" id="terms" required class="viggo">Jag godkänner villkoren
        </label>
        <button type="submit" class="viggo">Skicka</button>
    </form>
    <div id="errorMessages" style="color:red;"></div>
</body>
</html>
